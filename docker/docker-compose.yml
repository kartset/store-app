services:
  db:
    image: postgres:15
    env_file: ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-store_user} -d $${POSTGRES_DB:-store_db}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    entrypoint: ["/entrypoint.sh"]
    command: ["uv", "run", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ./entrypoint.sh:/entrypoint.sh
      - uv_cache:/root/.cache/uv

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    env_file: ../.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn/v6

volumes:
  postgres_data:
  uv_cache:
  yarn_cache:
