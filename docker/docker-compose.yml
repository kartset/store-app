services:
  db:
    image: postgres:15
    env_file: ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ../backend:/app
      - uv_cache:/root/.cache/uv

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    env_file: ../.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - yarn_cache:/usr/local/share/.cache/yarn/v6

volumes:
  postgres_data:
  uv_cache:
  yarn_cache:
