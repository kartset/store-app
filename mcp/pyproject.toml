[project]
name = "store-mcp"
version = "0.1.0"
description = "StoreCraft MCP Service for Analytics and AI Agent Tool Execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "django>=5.0",
    "dj-database-url>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["tools"]

